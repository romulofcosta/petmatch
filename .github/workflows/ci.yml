name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # TODO Phase 4 (#19/#20): remover flags quando os lints de estilo e assets
      # forem resolvidos. Sem elas, o analyze falha por dívida pré-existente.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: flutter test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # TODO Phase 1 (#1+): reverter para "flutter test" direto quando os
      # testes do refactor forem commitados na main.
      - name: flutter test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Ainda sem diretório test/ commitado na main. Aguardando Phase 1."
          fi