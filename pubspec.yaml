name: petmatch
description: PetMatch - Encontre o par perfeito para seu pet
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Supabase
  supabase_flutter: ^2.5.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # Navigation
  go_router: ^14.3.0

  # Location
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.4

  # Image
  image_picker: ^1.1.2
  image_cropper: ^8.0.1

  # Permissions
  permission_handler: ^11.3.1

  # Environment
  flutter_dotenv: ^5.2.0

  # JSON Serialization
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
